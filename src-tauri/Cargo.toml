[package]
name = "pdfcraft"
version = "0.1.0"
description = "PDFCraft Desktop Application"
authors = ["PDFCraft"]
edition = "2021"

[lib]
name = "pdfcraft"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Android Storage Access Framework picker and content:// streaming support.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "=29.0.0"
