name: Android APK (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check source has arrived
        run: |
          test -f package.json || { echo "Full upstream import has not completed"; exit 1; }
          test -f src-tauri/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install dependencies
        run: npm ci
      - name: Validate source tests
        run: npm test -- --run
      - name: Prepare Android identifier and output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='src-tauri/tauri.conf.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.identifier='com.explapp.pdftools';
          j.productName='90 PDF';
          j.bundle.targets=['apk','aab'];
          fs.writeFileSync(p,JSON.stringify(j,null,2));
          NODE
      - name: Initialize Tauri Android project
        run: npx tauri android init --ci
      - name: Build universal debug APK
        run: npx tauri android build --apk --debug --ci
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 90-pdf-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
      - name: Upload Android build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            src-tauri/gen/android/**/build/reports/**
            src-tauri/gen/android/**/build/outputs/logs/**
          if-no-files-found: ignore
