name: Android APK (ARM64 release)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, improve/pdf-open-source-reuse]
    paths-ignore:
      - '**/*.md'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: android-build-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check source has arrived
        run: |
          test -f package.json || { echo "Full upstream import has not completed"; exit 1; }
          test -f src-tauri/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and NDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o /tmp/commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-tauri
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee typescript-errors.log
      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-typescript-errors
          path: typescript-errors.log
          if-no-files-found: ignore
      - name: Run unit tests
        run: npm test
      - name: Build production web assets
        run: npm run build
      - name: Prepare Android identifier and output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='src-tauri/tauri.conf.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.identifier='com.explapp.pdftools';
          j.productName='90 PDF';
          fs.writeFileSync(p,JSON.stringify(j,null,2));
          NODE
      - name: Initialize Tauri Android project
        run: npx tauri android init --ci
      - name: Build ARM64 release APK
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_RELEASE_LTO: 'thin'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
          CARGO_PROFILE_RELEASE_STRIP: 'symbols'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 'z'
          CARGO_INCREMENTAL: '0'
        run: npx tauri android build --apk --ci --target aarch64
      - name: Sign and verify Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="src-tauri/gen/android/app/build/outputs/apk"
          UNSIGNED="$(find "$OUT" -type f -name '*unsigned.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED="$(find "$OUT" -type f -name '*release.apk' ! -path '*/signed/*' -print -quit)"
          fi
          test -n "$UNSIGNED" || { echo "Release APK not found"; find "$OUT" -type f -name '*.apk'; exit 1; }
          mkdir -p /tmp/pdfcraft-signing "$OUT/signed"
          KEYSTORE=/tmp/pdfcraft-signing/release.jks
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo "Incomplete Android signing secrets"; exit 1; }
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            echo "Using persistent release signing key from GitHub secrets."
          else
            KEYSTORE=/tmp/pdfcraft-signing/test.jks
            ANDROID_KEYSTORE_PASSWORD=changeit
            ANDROID_KEY_PASSWORD=changeit
            ANDROID_KEY_ALIAS=pdfcraft-test
            keytool -genkeypair -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=90 PDF Temporary Test Build,O=PDFCraft,C=SE"
            echo "::warning::No persistent signing secrets configured. This APK cannot upgrade previous temporary-key builds."
          fi
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" /tmp/pdfcraft-signing/aligned.apk
          "$ZIPALIGN" -c -p 4 /tmp/pdfcraft-signing/aligned.apk
          "$APKSIGNER" sign --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUT/signed/90-pdf-arm64-signed.apk" \
            /tmp/pdfcraft-signing/aligned.apk
          "$APKSIGNER" verify --verbose --print-certs "$OUT/signed/90-pdf-arm64-signed.apk"
          unzip -t "$OUT/signed/90-pdf-arm64-signed.apk" >/dev/null
          test "$(stat -c %s "$OUT/signed/90-pdf-arm64-signed.apk")" -gt 1000000
          rm -f "$UNSIGNED"
          echo "APK integrity, alignment, and signature verified."
      - name: Report APK size
        if: success()
        run: find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f -printf '%p %s bytes\n'
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 90-pdf-android-test-signed
          path: src-tauri/gen/android/app/build/outputs/apk/signed/*.apk
          if-no-files-found: error
      - name: Upload Android build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            src-tauri/gen/android/**/build/reports/**
            src-tauri/gen/android/**/build/outputs/logs/**
          if-no-files-found: ignore
