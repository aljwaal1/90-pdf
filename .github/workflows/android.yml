name: Android APK (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: android-build-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check source has arrived
        run: |
          test -f package.json || { echo "Full upstream import has not completed"; exit 1; }
          test -f src-tauri/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and NDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o /tmp/commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-tauri
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci
      - name: Prepare Android identifier and output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='src-tauri/tauri.conf.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.identifier='com.explapp.pdftools';
          j.productName='90 PDF';
          fs.writeFileSync(p,JSON.stringify(j,null,2));
          NODE
      - name: Initialize Tauri Android project
        run: npx tauri android init --ci
      - name: Strip desktop-only Rust crate attribute for Android
        run: sed -i '1d' src-tauri/src/main.rs
      - name: Build universal debug APK
        run: npx tauri android build --apk --debug --ci
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 90-pdf-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
      - name: Upload Android build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            src-tauri/gen/android/**/build/reports/**
            src-tauri/gen/android/**/build/outputs/logs/**
          if-no-files-found: ignore
