name: Validate 90 PDF
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee typescript-errors.log
      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-errors
          path: typescript-errors.log
          if-no-files-found: ignore
      - name: Unit tests
        run: npm test
      - name: Build web assets
        run: npm run build
